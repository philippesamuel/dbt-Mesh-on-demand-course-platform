name: core_platform
version: "2.1.0"
config-version: 2

profile: "snowflake"
require-dbt-version: ">=1.6.0"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  truncate_timespan_to: "{{ current_timestamp() }}"
  dbt-osmosis:
    sources:
      jaffle_shop: "staging/__sources.yml"
    models:
      staging: "_schema.yml"
      marts: "_{model}.yml" 
    yaml_settings:
      preserve_quotes: true
    use-unrendered-descriptions: true
    output-to-lower: true 

models:
  core_platform:
    staging:
      +materialized: view
    marts:
      +materialized: table
